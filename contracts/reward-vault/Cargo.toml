[package]
name = "kalea-reward-vault"
version = "0.1.0"
edition = "2021"
publish = false
description = "Kalea merchant reward vault with 7-day vesting and dispute slashing on Stellar"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
