[package]
name = "kalea-escrow"
version = "0.1.0"
edition = "2021"
publish = false
description = "Kalea per-order USDC escrow for B2B ramp settlement on Stellar (Soroban)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
